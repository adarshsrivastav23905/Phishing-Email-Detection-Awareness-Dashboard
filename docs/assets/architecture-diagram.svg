  <rect x="910" y="120" width="220" height="120" rx="20" fill="#152238" stroke="#F59E0B"/>
  <text x="1020" y="165" text-anchor="middle" fill="#FEF3C7" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Risk Scoring</text>
  <text x="1020" y="198" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Segoe UI, Arial, sans-serif">Safe • Low • Suspicious</text>

  <path d="M290 180H350" stroke="#60A5FA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M570 180H630" stroke="#34D399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M850 180H910" stroke="#A78BFA" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#34D399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect x="340" y="320" width="520" height="200" rx="24" fill="#0F172A" stroke="#334155"/>
  <text x="600" y="372" text-anchor="middle" fill="#F8FAFC" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Security Intelligence Layer</text>
  <text x="600" y="420" text-anchor="middle" fill="#CBD5E1" font-size="18" font-family="Segoe UI, Arial, sans-serif">Sender Review • URL Risk • Content Manipulation • Attachment Checks</text>
