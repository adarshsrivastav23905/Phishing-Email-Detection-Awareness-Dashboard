  <text x="180" y="198" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Segoe UI, Arial, sans-serif">Sender • Subject • Body</text>

  <rect x="350" y="120" width="220" height="120" rx="20" fill="#152238" stroke="#34D399"/>
  <text x="460" y="165" text-anchor="middle" fill="#ECFDF5" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Preprocessing</text>
  <text x="460" y="198" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Segoe UI, Arial, sans-serif">Normalize • Extract URLs</text>

  <rect x="630" y="120" width="220" height="120" rx="20" fill="#152238" stroke="#A78BFA"/>
  <text x="740" y="165" text-anchor="middle" fill="#F5F3FF" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Feature Engine</text>
