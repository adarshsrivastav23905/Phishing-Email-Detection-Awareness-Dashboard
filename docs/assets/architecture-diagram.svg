  <text x="1030" y="420" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Segoe UI, Arial, sans-serif">Analytics</text>
  <text x="1030" y="444" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Segoe UI, Arial, sans-serif">History</text>

