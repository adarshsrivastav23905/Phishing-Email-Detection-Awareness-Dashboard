  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" fill="#E2E8F0" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Phishing Detection Architecture</text>

  <rect x="70" y="120" width="220" height="120" rx="20" fill="#152238" stroke="#60A5FA"/>
